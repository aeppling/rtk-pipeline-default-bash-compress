# benchmark.toml — numbers published by the pipeline author.
# The marketplace shows them as "author's benchmark"; the bot checks the shape only.
schema_version = 1

[benchmark]
suite          = "SkillsBench"
agent          = "Claude Code"
model          = "claude-opus-4-8"
baseline       = "stock Claude Code"
trials_per_arm = 48
dates          = ["2026-08-10"]
details        = "RESULTS.md"
raw            = "results.tsv"
notes          = "12 tasks, 4 trials per arm per task, both arms in the same batch, RTK v0.45.0 PreToolUse hook only; runtime-error trials excluded; data-to-d3 ran too but is left out of the aggregates (no verifier score, unbalanced arms). Pooled over all trials with a permutation test: -4.8%, p = 0.305, i.e. cost-neutral to slightly cheaper. Pass rate is the mean reward over the 11 tasks whose verifier produced a score; spring-boot-jakarta-migration has none."

[benchmark.cost]
# mean cost per trial, USD, summed over the 12 tasks
baseline = 12.098
pipeline = 11.349
per      = "trial"

[benchmark.quality]
metric   = "reward"
baseline = 0.49
pipeline = 0.46

